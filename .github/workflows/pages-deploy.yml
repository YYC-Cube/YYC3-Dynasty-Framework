name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'edict/frontend/**'
      - 'docs/**'
      - 'public/**'
      - 'README.md'
      - '.github/workflows/pages-deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: edict/frontend
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: edict/frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build
        env:
          VITE_API_URL: https://api.dynasty.yyc3.vip

      - name: Prepare Pages artifact
        run: |
          mkdir -p ../../_site
          cp -r dist/* ../../_site/
          cp dist/index.html ../../_site/404.html
          # Copy docs assets
          cp -r ../../docs/screenshots ../../_site/screenshots 2>/dev/null || true
          cp -r ../../docs/assets ../../_site/assets 2>/dev/null || true
          cp ../../public/YYC3-Family-001.png ../../_site/ 2>/dev/null || true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
